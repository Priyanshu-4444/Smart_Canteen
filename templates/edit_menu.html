<!DOCTYPE html>

<html>

<head>

```
<title>Edit Menu Item</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
    }

    .header {
        background-color: #2c3e50;
        color: white;
        padding: 25px;
        text-align: center;
    }

    .container {
        width: 90%;
        max-width: 600px;
        margin: 40px auto;
    }

    .form-box {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #2980b9;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
        color: #3498db;
        font-weight: bold;
    }

</style>
```

</head>

<body>

```
<div class="header">

    <h1>🍔 Smart Canteen</h1>

    <h2>✏️ Edit Food Item</h2>

</div>


<div class="container">

    <div class="form-box">

        <form method="POST">

            <label>Food Item Name</label>

            <input
                type="text"
                name="item_name"
                value="{{ item[1] }}"
                required
            >


            <label>Price (₹)</label>

            <input
                type="number"
                name="price"
                value="{{ item[2] }}"
                min="1"
                step="0.01"
                required
            >


            <label>Category</label>

<select name="category" required>

    <option value="">Select Category</option>

    <option value="South Indian"
        {% if item[3] == "South Indian" %}selected{% endif %}>
        South Indian
    </option>

    <option value="Snacks"
        {% if item[3] == "Snacks" %}selected{% endif %}>
        Snacks & Chaat
    </option>

    <option value="Beverage"
        {% if item[3] == "Beverage" %}selected{% endif %}>
        Beverages
    </option>

    <option value="Lunch"
        {% if item[3] == "Lunch" %}selected{% endif %}>
        Lunch & Thali
    </option>

    <option value="Fast Food"
        {% if item[3] == "Fast Food" %}selected{% endif %}>
        Chinese & Fast Food
    </option>

    <option value="Dessert"
        {% if item[3] == "Dessert" %}selected{% endif %}>
        Desserts & Bakery
    </option>

</select>

            <label>Availability</label>

            <select name="availability">

                <option value="Available"
                {% if item[4] == "Available" %}selected{% endif %}>
                    Available
                </option>

                <option value="Unavailable"
                {% if item[4] == "Unavailable" %}selected{% endif %}>
                    Unavailable
                </option>

            </select>


            <button type="submit">
                💾 Save Changes
            </button>

        </form>


        <a href="/admin/menu" class="back">
            ← Back to Menu Management
        </a>

    </div>

</div>
```

</body>

</html>
