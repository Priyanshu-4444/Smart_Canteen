<!DOCTYPE html>
<html>

<head>

    <title>Sales Report</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 10px 0;
            font-size: 30px;
        }

        .card p {
            margin: 0;
            color: #555;
            font-weight: bold;
        }

        .revenue {
            color: #27ae60;
        }

        .orders {
            color: #3498db;
        }

        .today {
            color: #f39c12;
        }

        .button-box {
            text-align: center;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .admin-button {
            background-color: #3498db;
        }

        .menu-button {
            background-color: #27ae60;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <h1>📊 Sales Report</h1>

        <p><h1>🍔 Smart Canteen Food Ordering System</h1></p>

    </div>


    <div class="container">

        <div class="stats">

            <div class="card">

                <h2 class="revenue">
                    ₹{{ "%.2f"|format(total_revenue) }}
                </h2>

                <p>💰 Total Revenue</p>

            </div>


            <div class="card">

                <h2 class="orders">
                    {{ total_orders }}
                </h2>

                <p>📦 Total Orders</p>

            </div>


            <div class="card">

                <h2 class="today">
                    ₹{{ "%.2f"|format(todays_revenue) }}
                </h2>

                <p>📅 Today's Revenue</p>

            </div>


            <div class="card">

                <h2 class="today">
                    {{ todays_orders }}
                </h2>

                <p>🛒 Today's Orders</p>

            </div>

        </div>


        <div class="button-box">

            <a href="/admin" class="button admin-button">
                👨‍💼 Admin Dashboard
            </a>

            <a href="/admin/menu" class="button menu-button">
                🍔 Manage Menu
            </a>

        </div>

    </div>

</body>

</html>
