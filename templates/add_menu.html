```html
<!DOCTYPE html>
<html>

<head>

    <title>Add Menu Item</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .form-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #219150;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>🍔 Smart Canteen</h1>

        <h2>➕ Add New Food Item</h2>

    </div>


    <div class="container">

        <div class="form-box">

            <form method="POST">

                <label>Food Item Name</label>

                <input
                    type="text"
                    name="item_name"
                    placeholder="Example: Samosa"
                    required
                >


                <label>Price (₹)</label>

                <input
                    type="number"
                    name="price"
                    placeholder="Example: 20"
                    min="1"
                    step="0.01"
                    required
                >


                <label>Category</label>

                <select name="category" required>

                    <option value="">Select Category</option>

                    <option value="Fast Food">
                        Fast Food
                    </option>

                    <option value="Snacks">
                        Snacks
                    </option>

                    <option value="Beverage">
                        Beverage
                    </option>

                    <option value="Dessert">
                        Dessert
                    </option>

                </select>


                <label>Availability</label>

                <select name="availability">

                    <option value="Available">
                        Available
                    </option>

                    <option value="Unavailable">
                        Unavailable
                    </option>

                </select>


                <button type="submit">
                    ➕ Add Food Item
                </button>

            </form>

            <a href="/admin/menu" class="back">
                ← Back to Menu Management
            </a>

        </div>

    </div>

</body>

</html>
```
