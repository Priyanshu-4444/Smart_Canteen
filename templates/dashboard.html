<!DOCTYPE html>
<html>

<head>

    <title>Student Dashboard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .welcome {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
    display: block;
    background-color: white;
    padding: 25px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #ddd;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    text-decoration: none;
    color: inherit;
    box-sizing: border-box;
}
        }

        .card h2 {
            font-size: 30px;
            margin: 10px;
        }

        .card p {
            font-weight: bold;
            color: #555;
        }

        .orders {
            color: #3498db;
        }

        .menu {
            color: #27ae60;
        }

        .account {
            color: #9b59b6;
        }

        .buttons {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 8px;
            font-weight: bold;
        }

        .menu-button {
            background-color: #27ae60;
        }

        .order-button {
            background-color: #3498db;
        }

        .logout {
            background-color: #e74c3c;
        }

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h1>🍔 Smart Canteen Food Ordering System</h1>

        <h2>🎓 Student Dashboard</h2>

    </div>


    <div class="container">


        <!-- WELCOME -->

        <div class="welcome">

            <h2>
                👋 Welcome, {{ name }}!
            </h2>

            <p>
                <strong>Email:</strong>
                {{ email }}
            </p>

            <p>
                <strong>Role:</strong>
                {{ role }}
            </p>

        </div>


        <!-- DASHBOARD CARDS -->

        <a href="/my_orders" class="card">

    <div class="orders">

        <h2>
            📦 {{ total_orders }}
        </h2>

    </div>

    <p>
        My Total Orders
    </p>

</a>

<a href="/menu" class="card">

    <div class="menu">

        <h2>
            🍔
        </h2>

    </div>

    <p>
        Canteen Menu
    </p>

</a>
            </div>


            <a href="/dashboard" class="card">

    <div class="account">

        <h2>
            👤
        </h2>

    </div>

    <p>
        Student Account
    </p>

</a>

        
        <!-- BUTTONS -->

        <div class="buttons">

            <h2>What would you like to do?</h2>


            <a
                href="/menu"
                class="button menu-button"
            >
                🍔 View Menu
            </a>


            <a
                href="/my_orders"
                class="button order-button"
            >
                📋 My Orders
            </a>


            <a
                href="/logout"
                class="button logout"
            >
                🚪 Logout
            </a>

        </div>


    </div>


</body>

</html>
